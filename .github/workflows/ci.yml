name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  product:
    name: Product (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore product solution
        run: dotnet restore SpanDraft.sln
      - name: Verify generated icon resources
        run: dotnet run --file scripts/update-icons.cs -- --check
      - name: Build product solution
        run: dotnet build SpanDraft.sln --configuration Release --no-restore
      - name: Run product tests
        run: dotnet test --solution SpanDraft.sln --configuration Release --no-build --no-restore

  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore validation solution
        run: dotnet restore validation/SpanDraft.Validation.sln
      - name: Build validation solution
        run: dotnet build validation/SpanDraft.Validation.sln --configuration Release --no-restore
      - name: Run validation tests
        run: dotnet test --solution validation/SpanDraft.Validation.sln --configuration Release --no-build --no-restore
      - name: Run validation acceptance
        run: |
          dotnet run \
            --project validation/dotnet/SpanDraft.Validation.Runner \
            --configuration Release \
            --no-build \
            -- compare \
            --report "${RUNNER_TEMP}/spandraft-validation-report.json"
      - name: Verify solver source hash
        shell: bash
        run: |
          expected_hash='c04abe6746bac053da19640bc0ba908078f4a8a19595c4b1763a1d7a5c582ccb'
          actual_hash=$(jq -er '.solverSourceSha256' \
            "${RUNNER_TEMP}/spandraft-validation-report.json")

          printf 'SolverSourceSha256: %s\n' "$actual_hash"

          if [ "$actual_hash" != "$expected_hash" ]; then
            printf 'Expected SolverSourceSha256: %s\n' "$expected_hash" >&2
            exit 1
          fi

  help:
    name: Help (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install help generator
        run: python -m pip install -r help/requirements.txt
      - name: Build and validate offline help
        run: dotnet run --file scripts/build-help.cs
