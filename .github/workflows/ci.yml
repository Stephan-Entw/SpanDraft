name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  product:
    name: Product (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore product solution
        run: dotnet restore SpanDraft.sln
      - name: Verify generated icon resources
        run: dotnet run --file scripts/update-icons.cs -- --check
      - name: Build product solution
        run: dotnet build SpanDraft.sln --configuration Release --no-restore
      - name: Run product tests
        run: dotnet test --solution SpanDraft.sln --configuration Release --no-build --no-restore

  validation:
    name: Validation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore validation solution
        run: dotnet restore validation/SpanDraft.Validation.sln
      - name: Build validation solution
        run: dotnet build validation/SpanDraft.Validation.sln --configuration Release --no-restore
      - name: Run validation tests
        run: dotnet test --solution validation/SpanDraft.Validation.sln --configuration Release --no-build --no-restore
      - name: Run validation acceptance
        run: |
          dotnet run \
            --project validation/dotnet/SpanDraft.Validation.Runner \
            --configuration Release \
            --no-build \
            -- compare \
            --report "${RUNNER_TEMP}/spandraft-validation-report.json"
      - name: Verify solver source hash
        shell: bash
        run: |
          expected_hash='6be871757c9b72df0101e06182068978f8117703f999e84bb13c22b4ec6f29fb'
          actual_hash=$(jq -er '.solverSourceSha256' \
            "${RUNNER_TEMP}/spandraft-validation-report.json")

          printf 'SolverSourceSha256: %s\n' "$actual_hash"

          if [ "$actual_hash" != "$expected_hash" ]; then
            printf 'Expected SolverSourceSha256: %s\n' "$expected_hash" >&2
            exit 1
          fi

  help:
    name: Help (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install help generator
        run: python -m pip install -r help/requirements.txt
      - name: Build offline help with committed assets
        run: dotnet run --file scripts/build-help.cs -- --no-regenerate-assets
      - name: Regenerate and validate offline help
        run: dotnet run --file scripts/build-help.cs
      - name: Verify published offline help
        shell: pwsh
        run: |
          dotnet publish src/SpanDraft.Desktop/SpanDraft.Desktop.csproj --configuration Release --no-self-contained --output artifacts/help-publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          $source = (Resolve-Path help/site).Path
          foreach ($file in Get-ChildItem $source -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath($source, $file.FullName)
            $published = Join-Path artifacts/help-publish/Help $relative
            if (-not (Test-Path -LiteralPath $published -PathType Leaf) -or
                (Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $published).Hash) {
              throw "Missing or altered published help file: $relative"
            }
          }
