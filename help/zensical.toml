# Shared offline manual build template. See README.md for the build workflow.
[project]
site_name = "{{title}}"
docs_dir = "{{docs}}"
site_dir = "{{site}}"
use_directory_urls = false
extra_css = ["stylesheets/spandraft.css"]
extra_javascript = ["js/spandraft-help.js"]
{{navigation}}

# Offline search uses the local iframe-worker polyfill configured below.
[project.plugins.offline]

[project.theme]
custom_dir = "shared/overrides"
language = "{{language}}"
font = false

[project.extra]
polyfills = [
  { path = "js/iframe-worker-shim.js", type = "text/javascript", async = false, defer = false },
]
